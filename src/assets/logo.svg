  <!-- Background gold arc -->
  <path d="M 80 320 Q 20 160 120 60" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Letter G - Maroon -->
  <path d="M 175 100 C 110 100 65 155 65 215 C 65 280 115 330 180 330 C 215 330 240 315 255 290 L 255 240 L 195 240 L 195 265 L 225 265 C 215 280 200 295 180 295 C 135 295 105 260 105 215 C 105 165 135 130 180 130 C 200 130 215 138 225 150 L 255 150 C 238 118 210 100 175 100 Z" fill="url(#maroonGrad)"/>

  <!-- Letter A - Gold -->
  <path d="M 195 330 L 255 150 L 285 150 L 345 330 L 308 330 L 292 285 L 248 285 L 232 330 Z M 255 255 L 270 205 L 285 255 Z" fill="url(#goldGrad)"/>

  <!-- Growth arrow - Gold -->
  <path d="M 200 300 C 230 270 270 240 310 200 C 330 180 350 155 370 130 L 370 170 C 355 188 338 208 320 228 C 285 268 250 295 220 310 Z" fill="url(#arrowGrad)"/>
  <!-- Arrow head -->
  <path d="M 370 120 L 395 105 L 395 155 L 370 140 Z" fill="url(#arrowGrad)"/>

  <!-- Bar chart - Maroon -->
  <rect x="290" y="310" width="14" height="30" rx="2" fill="url(#maroonGrad)" opacity="0.9"/>
  <rect x="312" y="290" width="14" height="50" rx="2" fill="url(#maroonGrad)" opacity="0.9"/>
  <rect x="334" y="265" width="14" height="75" rx="2" fill="url(#maroonGrad)" opacity="0.9"/>
  <rect x="356" y="240" width="14" height="100" rx="2" fill="url(#maroonGrad)" opacity="0.9"/>

  <!-- Gold decorative dots -->
  <circle cx="300" cy="55" r="5" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="320" cy="40" r="4" fill="url(#goldGrad)" opacity="0.7"/>
  <circle cx="338" cy="28" r="3" fill="url(#goldGrad)" opacity="0.6"/>
