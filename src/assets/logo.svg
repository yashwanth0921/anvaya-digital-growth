<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Cream background -->
  <rect width="512" height="512" rx="40" fill="#F5EDE3"/>
  
  <!-- Curved maroon bottom border -->
  <path d="M0 440 Q256 510 512 440 L512 512 L0 512 Z" fill="#691E2A"/>
  <path d="M0 440 Q256 510 512 440" stroke="#B28452" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Gold circular arc around monogram -->
  <path d="M120 70 C50 70, 10 150, 10 250 C10 350, 50 420, 120 420" stroke="#B28452" stroke-width="2.5" fill="none" opacity="0.35"/>
  
  <!-- Maroon G letter -->
  <path d="M185 120 C100 120, 45 195, 45 265 C45 335, 100 400, 185 400 L185 360 L130 360 L130 310 L185 310" stroke="#691E2A" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Gold A letter -->
  <path d="M195 370 L255 115 L315 370" stroke="#B28452" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="212" y1="300" x2="298" y2="300" stroke="#B28452" stroke-width="10"/>
  
  <!-- Gold growth arrow -->
  <path d="M295 330 L330 240 L365 145" stroke="#B28452" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M348 152 L365 145 L365 162" stroke="#B28452" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Maroon growth bars -->
  <rect x="320" y="340" width="18" height="55" rx="4" fill="#691E2A"/>
  <rect x="348" y="305" width="18" height="90" rx="4" fill="#691E2A"/>
  <rect x="376" y="260" width="18" height="135" rx="4" fill="#691E2A"/>
  
  <!-- Gold decorative dots -->
  <circle cx="370" cy="120" r="5" fill="#B28452" opacity="0.6"/>
  <circle cx="385" cy="105" r="3.5" fill="#B28452" opacity="0.45"/>
  <circle cx="397" cy="93" r="2.5" fill="#B28452" opacity="0.3"/>
  
  <!-- "Grow With" text with gold side lines -->
  <line x1="130" y1="445" x2="200" y2="445" stroke="#B28452" stroke-width="1.5" opacity="0.5"/>
  <text x="256" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#691E2A" letter-spacing="1">Grow With</text>
  <line x1="312" y1="445" x2="382" y2="445" stroke="#B28452" stroke-width="1.5" opacity="0.5"/>
  
  <!-- "ANVAYA" text with decorative diamonds -->
  <text x="256" y="488" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#B28452" letter-spacing="6">ANVAYA</text>
  
  <!-- Small diamond decorations in the A's of ANVAYA -->
  <polygon points="208,476 211,472 214,476 211,480" fill="#B28452" opacity="0.5"/>
  <polygon points="376,476 379,472 382,476 379,480" fill="#B28452" opacity="0.5"/>
  
  <!-- "STRATEGY. GROWTH. IMPACT." tagline -->
  <text x="256" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#691E2A" letter-spacing="2.5" opacity="0.7">STRATEGY. GROWTH. IMPACT.</text>
</svg>
