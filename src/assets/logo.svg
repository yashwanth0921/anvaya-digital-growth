<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9963B"/>
      <stop offset="40%" style="stop-color:#E8C564"/>
      <stop offset="70%" style="stop-color:#F0D87A"/>
      <stop offset="100%" style="stop-color:#B8862D"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2040"/>
      <stop offset="50%" style="stop-color:#6B1832"/>
      <stop offset="100%" style="stop-color:#4A1022"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9963B"/>
      <stop offset="50%" style="stop-color:#F0D87A"/>
      <stop offset="100%" style="stop-color:#E8C564"/>
    </linearGradient>
    <linearGradient id="anvayaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B2040"/>
      <stop offset="30%" style="stop-color:#C9963B"/>
      <stop offset="70%" style="stop-color:#E8C564"/>
      <stop offset="100%" style="stop-color:#8B2040"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFF8EE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F5E6D0;stop-opacity:0.3"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Bottom maroon curve -->
  <path d="M 0 480 Q 250 420 500 480 L 500 500 L 0 500 Z" fill="url(#maroonGrad)"/>
  <path d="M 0 475 Q 250 415 500 475" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Gold arc behind GA -->
  <path d="M 110 320 Q 130 100 300 80" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M 115 315 Q 135 105 295 85" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Letter G - Maroon with 3D effect -->
  <path d="M 215 105 C 145 105 95 165 95 230 C 95 300 145 355 215 355 C 255 355 285 335 305 305 L 305 250 L 235 250 L 235 280 L 270 280 C 258 298 240 315 215 315 C 168 315 135 278 135 230 C 135 178 168 145 215 145 C 240 145 258 155 270 170 L 305 170 C 285 128 252 105 215 105 Z" fill="url(#maroonGrad)"/>
  <!-- G shadow -->
  <path d="M 218 108 C 148 108 98 168 98 233 C 98 303 148 358 218 358 C 258 358 288 338 308 308" fill="none" stroke="#3A0A15" stroke-width="2" opacity="0.3"/>

  <!-- Letter A - Gold with 3D effect -->
  <path d="M 225 355 L 290 165 L 325 165 L 390 355 L 350 355 L 335 305 L 280 305 L 265 355 Z M 293 275 L 310 215 L 327 275 Z" fill="url(#goldGrad)"/>
  <!-- A shadow -->
  <path d="M 228 358 L 293 168 L 328 168" fill="none" stroke="#8B6914" stroke-width="1.5" opacity="0.4"/>

  <!-- Growth arrow - Gold with shine -->
  <path d="M 225 320 C 260 285 305 245 350 195 C 370 170 388 142 405 115 L 405 155 C 390 175 372 198 353 220 C 315 265 275 305 245 325 Z" fill="url(#arrowGrad)"/>
  <!-- Arrow head -->
  <path d="M 405 105 L 435 85 L 435 135 L 405 125 Z" fill="url(#arrowGrad)"/>
  <!-- Arrow shine -->
  <path d="M 350 195 C 370 170 388 142 405 115 L 405 108 C 390 130 372 155 353 178 Z" fill="#F5E0A0" opacity="0.3"/>

  <!-- Bar chart - Maroon -->
  <rect x="330" y="330" width="16" height="35" rx="2" fill="url(#maroonGrad)"/>
  <rect x="354" y="305" width="16" height="60" rx="2" fill="url(#maroonGrad)"/>
  <rect x="378" y="275" width="16" height="90" rx="2" fill="url(#maroonGrad)"/>
  <rect x="402" y="245" width="16" height="120" rx="2" fill="url(#maroonGrad)"/>

  <!-- Gold decorative dots -->
  <circle cx="340" cy="62" r="5" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="362" cy="48" r="4" fill="url(#goldGrad)" opacity="0.75"/>
  <circle cx="380" cy="36" r="3.2" fill="url(#goldGrad)" opacity="0.65"/>
  <circle cx="395" cy="27" r="2.5" fill="url(#goldGrad)" opacity="0.55"/>

  <!-- "Grow With" text - Maroon -->
  <text x="250" y="405" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="400" fill="#6B1832" letter-spacing="2">Grow With</text>

  <!-- Decorative lines beside "Grow With" -->
  <line x1="60" y1="395" x2="130" y2="395" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="370" y1="395" x2="440" y2="395" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- "ANVAYA" text - Gold with maroon accents -->
  <text x="250" y="448" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="url(#anvayaGrad)" letter-spacing="8">ANVAYA</text>

  <!-- Small diamond decorations in ANVAYA -->
  <path d="M 115 438 L 118 435 L 121 438 L 118 441 Z" fill="#8B2040" opacity="0.6"/>
  <path d="M 379 438 L 382 435 L 385 438 L 382 441 Z" fill="#8B2040" opacity="0.6"/>

  <!-- Tagline -->
  <text x="250" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8B6914" letter-spacing="4" font-weight="500">STRATEGY. GROWTH. IMPACT.</text>

  <!-- Tagline decorative lines -->
  <line x1="100" y1="468" x2="155" y2="468" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <line x1="345" y1="468" x2="400" y2="468" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
</svg>