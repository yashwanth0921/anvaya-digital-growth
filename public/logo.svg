<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Cream background -->
  <rect width="512" height="512" rx="40" fill="#F5EDE3"/>
  
  <!-- Curved maroon bottom border -->
  <path d="M0 440 Q256 510 512 440 L512 512 L0 512 Z" fill="#691E2A"/>
  <path d="M0 440 Q256 510 512 440" stroke="#B28452" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Gold circular arc around monogram -->
  <path d="M120 70 C50 70, 10 150, 10 250 C10 350, 50 420, 120 420" stroke="#B28452" stroke-width="2.5" fill="none" opacity="0.35"/>
  
  <!-- Maroon G letter -->
  <path d="M185 120 C100 120, 45 195, 45 256 C45 317, 100 372, 185 372 L185 340 L130 340 L130 300 L185 300" stroke="#691E2A" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Gold A letter -->
  <path d="M195 345 L255 115 L315 345" stroke="#B28452" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="212" y1="280" x2="298" y2="280" stroke="#B28452" stroke-width="10"/>
  
  <!-- Gold growth arrow -->
  <path d="M295 310 L330 230 L365 145" stroke="#B28452" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M348 152 L365 145 L365 162" stroke="#B28452" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Maroon growth bars -->
  <rect x="320" y="320" width="18" height="55" rx="4" fill="#691E2A"/>
  <rect x="348" y="290" width="18" height="85" rx="4" fill="#691E2A"/>
  <rect x="376" y="250" width="18" height="125" rx="4" fill="#691E2A"/>
  
  <!-- Gold decorative dots -->
  <circle cx="370" cy="120" r="5" fill="#B28452" opacity="0.6"/>
  <circle cx="385" cy="105" r="3.5" fill="#B28452" opacity="0.45"/>
  <circle cx="397" cy="93" r="2.5" fill="#B28452" opacity="0.3"/>
</svg>
